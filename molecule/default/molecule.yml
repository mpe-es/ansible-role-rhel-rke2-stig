---
###############################################################################
# Filename: molecule/default/molecule.yml
# Role: ansible-role-rhel-rke2-stig
# Summary: Molecule test configuration for RHEL 9 STIG compliance testing
# Last Updated: 08 Oct 2026
# Classification: UNCLASSIFIED
###############################################################################
dependency:
  name: galaxy
  options:
    requirements-file: "${MOLECULE_SCENARIO_DIRECTORY}/requirements.yml"
    role-file: "${MOLECULE_SCENARIO_DIRECTORY}/requirements.yml"

driver:
  name: podman

platforms:
  - name: rhel9-stig
    # Rocky Linux 9 (ubi-init): downstream bug-for-bug RHEL 9 rebuild (higher
    # STIG fidelity than upstream CentOS Stream). The -ubi-init variant ships
    # systemd as PID 1 (/usr/sbin/init) for service-management testing, with
    # Rocky's full repos preconfigured (GPG keys included), so no external
    # repos or key fetches are needed in prepare.yml. quay.io avoids Docker Hub
    # anonymous pull limits.
    image: quay.io/rockylinux/rockylinux:9-ubi-init@sha256:c10a398e6919c7d182fc4048c1c34d2462204f6366f42492e793ae9490207ff4
    pre_build_image: true
    privileged: true
    command: /usr/sbin/init
    # Podman systemd mode mounts /run and /tmp. Do not add `tmpfs:`: molecule's
    # schema requires a list, podman_container a dict.
    systemd: "always"
    capabilities:
      - SYS_ADMIN
      - AUDIT_WRITE
      - AUDIT_CONTROL

provisioner:
  name: ansible
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
  inventory:
    host_vars:
      rhel9-stig:
        ansible_python_interpreter: /usr/bin/python3
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
  config_options:
    defaults:
      callbacks_enabled: profile_tasks
      gathering: smart
      fact_caching: jsonfile
      fact_caching_connection: /tmp/ansible_facts
    ssh_connection:
      pipelining: true

verifier:
  name: ansible

scenario:
  name: default
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
