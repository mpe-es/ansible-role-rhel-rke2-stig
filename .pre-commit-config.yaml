---
###############################################################################
# Filename: .pre-commit-config.yaml
# Role: ansible-role-rhel-rke2-stig
# Summary: Pre-commit hooks for local linting before push
# Last Updated: 23 Jan 2026
# Classification: UNCLASSIFIED
###############################################################################
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

repos:
  # YAML Linting
  - repo: https://github.com/adrienverge/yamllint
    rev: 81e9f98ffd059efe8aa9c1b1a42e5cce61b640c6  # frozen: v1.35.1
    hooks:
      - id: yamllint
        args: [-c, .yamllint]
        types: [yaml]

  # Ansible Linting
  # Note: ansible-core 2.21+ requires Python 3.12+ (matches requirements.txt)
  - repo: https://github.com/ansible/ansible-lint
    rev: 5fac056c45595896c973fbde871f01f6cb14d74c  # frozen: v26.4.0
    hooks:
      - id: ansible-lint
        args: []
        language_version: python3.12
        additional_dependencies:
          - ansible-core==2.21.5

  # General file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b  # frozen: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        # .gitignore's macOS Icon rule needs its two trailing CRs
        exclude: ^\.gitignore$
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: detect-private-key
