---
###############################################################################
# Filename: .pre-commit-config.yaml
# Role: ansible-role-rhel-rke2-stig
# Summary: Pre-commit hooks for local linting before push
# Last Updated: 16 Nov 2026
# Classification: UNCLASSIFIED
###############################################################################

# Project floor; `language: unsupported` (local hooks below) needs 4.4.0+.
minimum_pre_commit_version: '4.5.0'

repos:
  # Every hook runs a tool installed from the hash-pinned requirements.txt
  # (see CONTRIBUTING.md); nothing is downloaded by pre-commit.
  - repo: local
    hooks:
      - id: yamllint
        name: yamllint
        entry: yamllint
        args: [-c, .yamllint]
        language: unsupported
        types: [yaml]

      - id: ansible-lint
        name: ansible-lint
        entry: ansible-lint
        language: unsupported
        pass_filenames: false
        always_run: true

      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: trailing-whitespace-fixer
        args: [--markdown-linebreak-ext=md]
        # .gitignore's macOS Icon rule needs its two trailing CRs
        exclude: ^\.gitignore$
        language: unsupported
        types: [text]
        stages: [pre-commit, pre-push, manual]

      - id: end-of-file-fixer
        name: fix end of files
        entry: end-of-file-fixer
        language: unsupported
        types: [text]
        stages: [pre-commit, pre-push, manual]

      - id: check-yaml
        name: check yaml
        entry: check-yaml
        args: [--unsafe]
        language: unsupported
        types: [yaml]

      - id: check-added-large-files
        name: check for added large files
        entry: check-added-large-files
        args: [--maxkb=500, --enforce-all]
        language: unsupported
        stages: [pre-commit, pre-push, manual]

      - id: check-merge-conflict
        name: check for merge conflicts
        entry: check-merge-conflict
        args: [--assume-in-merge]
        language: unsupported
        types: [text]

      - id: detect-private-key
        name: detect private key
        entry: detect-private-key
        language: unsupported
        types: [text]
